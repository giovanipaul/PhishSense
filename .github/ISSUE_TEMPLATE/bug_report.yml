name: Bug report
description: Report reproducible behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes: {label: What happened?}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce}
    validations: {required: true}
  - type: input
    id: environment
    attributes: {label: Environment, placeholder: "Java version, OS, browser"}
