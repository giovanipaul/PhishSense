name: Keep portfolio demos warm
on:
  schedule:
    - cron: "*/5 8-19 * * 1-5"
      timezone: America/New_York
  workflow_dispatch:
permissions: {contents: read}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake PhishSense
        run: curl --fail --silent --show-error --location --max-time 120 --output /dev/null https://phishsense-7ado.onrender.com/
      - name: Wake ThreatLens preview
        if: always()
        run: curl --fail --silent --show-error --location --max-time 120 --output /dev/null https://threatlens-5c5k.onrender.com/demo
